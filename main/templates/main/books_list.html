{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books</title>
    <style>
      body{
        font-family:Segoe UI, Arial, Helvetica,
        sans-serif;margin:24px
    }
      table{
        border-collapse:collapse;
        width:100%
    }
      th,td{
        border:1px solid #ddd;
        padding:8px;
        text-align:left;
    }
      th{
        background:#f4f4f4;
    }
    </style>
  </head>
  <body>
    <h1>Books</h1>
    <p><a href="/authors/">View authors</a></p>
    {% if books %}
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Published</th>
          <th>Price</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        {% for book in books %}
        <tr>
          <td>{{ book.title }}</td>
          <td>{{ book.author.name }}</td>
          <td>{{ book.published_date }}</td>
          <td>{{ book.price }}</td>
          <td>{{ book.description|linebreaksbr }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p>No books found.</p>
    {% endif %}
  </body>
</html>
